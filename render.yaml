services:
  - type: web
    name: man-lhokseumawe-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ROLE_ADMIN_PASS
        sync: false
      - key: ROLE_HUMAS_PASS
        sync: false
      - key: ROLE_OSIM_PASS
        sync: false
